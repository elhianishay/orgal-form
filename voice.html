<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקראה קולית — אורגל</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f7f7f9; color: #222; text-align: center; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  #mic { width: 150px; height: 150px; border-radius: 50%; border: none; font-size: 64px; background: #dc3545; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #mic.on { animation: pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220,53,69,.6); } 100% { box-shadow: 0 0 0 28px rgba(220,53,69,0); } }
  #state { font-size: 18px; font-weight: bold; margin: 18px 0 8px; }
  #heard { font-size: 17px; min-height: 48px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
  #hint { font-size: 13px; color: #777; margin-top: 14px; line-height: 1.6; }
  button.sec { margin-top: 14px; padding: 10px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #999; background: #fff; }
</style>
</head>
<body>
<h1>🎤 הקראה לשורת מזין</h1>
<button id="mic" type="button" aria-label="התחל הקראה">🎤</button>
<div id="state">לחץ על המיקרופון ודבר</div>
<div id="heard"></div>
<button id="back" class="sec" type="button" style="display:none">חזרה לאפליקציה</button>
<div id="hint">מזין 3 על 63 · תרמי 63 · מגנטי 630 · מעגל Q12 · לולאה 0.35 · מתח 230 · מתכת / מבדד · מוזן מהלוח הראשי · ראשי 3 על 100</div>
<script>
(function () {
  // דף עצמאי מחוץ למסגרת של Google (שחוסמת מיקרופון). מקשיב, שולח את הטקסט לאפליקציה שפתחה אותו, ונסגר.
  var token = (location.hash.match(/t=([A-Za-z0-9_-]+)/) || [])[1] || '';
  var mic = document.getElementById('mic'), st = document.getElementById('state'), heard = document.getElementById('heard'), back = document.getElementById('back');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { st.textContent = 'הדפדפן לא תומך בזיהוי דיבור — פתח ב-Chrome'; mic.disabled = true; return; }
  var rec = null, busy = false;
  function send(text) {
    if (window.opener) {
      try { window.opener.postMessage({ type: 'orgal-voice', token: token, text: text }, '*'); } catch (e) {}
      st.textContent = '✅ נשלח לאפליקציה';
      setTimeout(function () { try { window.close(); } catch (e) {} back.style.display = 'inline-block'; }, 700);
    } else {
      st.textContent = 'הדף לא נפתח מהאפליקציה — חזור לאפליקציה ולחץ שם 🎤';
    }
  }
  back.onclick = function () { try { window.close(); } catch (e) {} };
  function start() {
    if (busy) { try { rec.stop(); } catch (e) {} return; }
    rec = new SR();
    rec.lang = 'he-IL'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    var finalText = '';
    rec.onstart = function () { busy = true; mic.classList.add('on'); st.textContent = '🎙 מקשיב... דבר עכשיו'; heard.textContent = ''; };
    rec.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript + ' ';
        else interim += ev.results[i][0].transcript;
      }
      heard.textContent = (finalText + interim).trim();
    };
    rec.onerror = function (ev) {
      var e = ev && ev.error;
      st.textContent = (e === 'not-allowed' || e === 'service-not-allowed') ? '⛔ אין הרשאה למיקרופון — אשר מיקרופון לאתר הזה (סמל המנעול בשורת הכתובת)'
        : (e === 'no-speech' ? '🤫 לא נשמע דיבור — לחץ שוב על המיקרופון' : '⚠ שגיאה: ' + e);
    };
    rec.onend = function () {
      busy = false; mic.classList.remove('on');
      var t = finalText.trim();
      if (t) send(t);
    };
    try { rec.start(); } catch (e) { st.textContent = '⚠ ' + e.message; }
  }
  mic.onclick = start;
  start(); /* מנסה להתחיל מיד; אם הדפדפן דורש לחיצה — לוחצים על המיקרופון */
})();
</script>
</body>
</html>
